<div class="col-md-4 project-item">
  <a style="text-decoration: none; color:black;" href="{{project.Thumbnail.Href}}">
    <div class="card mb-4 shadow-sm">
      <img src="{{project.Thumbnail.Cover}}" width="100%" height="100%">
      <div class="card-body">
        <p>{{project.Title}}</p>
        <hr>
        <p class="card-text">{{project.Thumbnail.Description}}</p>
        <ul class="list-group list-group-horizontal project-attributes">
          {% for tag in project.Tags %}
          <li class="list-group-item">{{tag}}</li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </a>
</div>
